[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pairloom"
version = "0.1.0"
description = "Pair-aware BAM realignment, overlap analysis, and paired-end read merging"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Yun Jiang", email = "jiangyunacw@gmail.com" }]
requires-python = ">=3.12"
keywords = ["bioinformatics", "bam", "paired-end", "read-merging", "alignment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "pysam>=0.22",
    "pyarrow>=16",
    "numpy>=1.26",
]

[project.scripts]
pairloom = "pairloom.cli:main"

[project.urls]
Homepage = "https://github.com/jiangyun-fun/pairloom"
Repository = "https://github.com/jiangyun-fun/pairloom"
Issues = "https://github.com/jiangyun-fun/pairloom/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/pairloom"]
dev-mode-dirs = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src/pairloom", "tests", "README.md", "pixi.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
timeout = 300

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]
