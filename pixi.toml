[workspace]
authors = ["Yun Jiang <jiangyunacw@gmail.com>"]
channels = ["conda-forge", "bioconda", "file:///bioproj/tools/share/conda-jy-essentials", "s3://conda/sibio"]
name = "pairloom"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
test = "pytest -q"
test-fast = "pytest -q -x"
lint = "ruff check src tests benchmarks"
format = "ruff format --check src tests benchmarks"
format-fix = "ruff format src tests benchmarks"
build = "python -m pip wheel --no-deps -w dist ."
bench = "python benchmarks/benchmark.py --pairs 20000 --threads 1,2,4 --output-dir benchmarks/results"
cli = "pairloom --help"
core = "python rust/install_core.py"

[dependencies]
samtools = "*"
python = ">=3.12,<3.14"
numpy = ">=2.5.4,<3"
pyarrow = ">=25.0.0,<26"
pysam = ">=0.24.1,<0.25"

[feature.dev.dependencies]
pip = "*"
pytest = "*"
pytest-timeout = "*"
ruff = "*"

[feature.dev.pypi-dependencies]
pairloom = { path = ".", editable = true }

[environments]
default = ["dev"]

